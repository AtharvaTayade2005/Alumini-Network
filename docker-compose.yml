services:
  postgres:
    image: postgres:16-alpine
    container_name: alumni-network-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alumni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-alumni_network}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alumni_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni_user} -d ${POSTGRES_DB:-alumni_network}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alumni_pgdata:
